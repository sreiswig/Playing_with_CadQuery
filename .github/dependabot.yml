# Dependabot: pip packages + GitHub Actions (weekly).
#
# requirements.txt lists cadquery unpinned (no lockfile). Semver-major pip
# version updates are ignored; a human decides breaking bumps. Minor and
# patch pip updates are grouped.
# Free-tier only — no paid GHAS / Dependency Review / larger runners.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
